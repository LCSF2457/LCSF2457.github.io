        <main class="main rounded shadow">
                <form>
                    <fieldset class="rounded shadow">
                        <legend>Personal Information</legend>
    
                        <ol>
                            <li>
                                <label for="name">Full Name:</label>
                                <input type="text" id="name" name="name" required placeholder="Enter your full name" autofocus>
                            </li>
                            <li>
                                <label for="email">Email Address:</label>
                                <input type="email" id="email" name="email" required placeholder="Enter your email address">
                            </li>
                            <li>
                                <label for="phone">Phone Number:</label>
                                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                            </li>
                        </ol>
                    </fieldset>
    
                    <fieldset class="rounded shadow">
                        <legend>Extra</legend>
    
                        <ol>
                            <li>
                                <label for="query">Your Query:</label>
                                <textarea id="query" name="query" rows="4" placeholder="Tell us your question or request" required></textarea>
                            </li>
                            <li>
                                <label for="date">Preferred Contact Date:</label>
                                <input type="date" id="date" name="date">
                            </li>
                            <li>
                                <label>Preferred Method of Contact:</label>
                                <input type="radio" id="phone-contact" name="contact-method" value="phone">
                                <label for="phone-contact">Phone</label>
                                <input type="radio" id="email-contact" name="contact-method" value="email" checked>
                                <label for="email-contact">Email</label>
                            </li>
                            <li>
                                <label for="newsletter">Subscribe to our Newsletter:</label>
                                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                            </li>
                            <li>
                                <label for="inquiry-type">Type of Inquiry:</label>
                                <select id="inquiry-type" name="inquiry-type">
                                    <option value="general">General Inquiry</option>
                                    <option value="sales">Sales</option>
                                    <option value="support">Support</option>
                                    <option value="other">Other</option>
                                </select>
                            </li>
                            <li>
                                <button type="submit">Submit Request</button>
                                <button type="reset">Reset Form</button>
                            </li>
                        </ol>
                    </fieldset>
                </form>
        </main>

        <footer class="footer">
